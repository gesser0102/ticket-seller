services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ticket_seller}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ticket_seller}
      POSTGRES_DB: ${POSTGRES_DB:-ticket_seller}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ticket_seller}"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres_test:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ticket_seller_test
      POSTGRES_PASSWORD: ticket_seller_test
      POSTGRES_DB: ticket_seller_test
    ports:
      - "5434:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticket_seller_test"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
